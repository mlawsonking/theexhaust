name: collect-cms-deficiencies
# C1 CMS Health Deficiencies — CMS OVERWRITES in place, so snapshots are load-bearing. Target: weekly.
# Over-schedule 2x/week (Mon+Thu) at an odd minute.
on:
  schedule:
    - cron: '17 4 * * 1,4'
  workflow_dispatch:
concurrency:
  group: collect-cms-deficiencies
  cancel-in-progress: false
jobs:
  run:
    uses: ./.github/workflows/_collector.yml
    with:
      target: cms-deficiencies
      entry: run
    secrets: inherit
