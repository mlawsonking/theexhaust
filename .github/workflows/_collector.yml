name: _collector
# Reusable collector runner (SPEC-02 §1). Called by the per-collector scheduled workflows.
# Standard runner only (larger runners bill on public repos — banned). No metered LLM key here.
# R2 creds + per-collector healthcheck heartbeats arrive via inherited Actions secrets; a missing
# HC_* secret resolves to "" and the heartbeat is inert (no crash) until W-003 creates the check.
on:
  workflow_call:
    inputs:
      target:
        description: collectors.run registry name (ignored when entry=ats)
        required: false
        type: string
        default: ""
      entry:
        description: "'run' -> collectors.run <target>; 'ats' -> collectors.ats_boards"
        required: false
        type: string
        default: run

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write          # W-002b: each job commits ONLY its own ops/state/health/<c>.json
                               # back to main (per-collector files ⇒ no write races) so the dedupe
                               # baseline persists across firings. Snapshots go to R2 as before.
    env:
      R2_BUCKET: ${{ secrets.R2_BUCKET }}
      R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      HC_CMS_DEFICIENCIES: ${{ secrets.HC_CMS_DEFICIENCIES }}
      HC_CPSC_RECALLS: ${{ secrets.HC_CPSC_RECALLS }}
      HC_NHTSA_RECALLS: ${{ secrets.HC_NHTSA_RECALLS }}
      HC_NHTSA_COMPLAINTS: ${{ secrets.HC_NHTSA_COMPLAINTS }}
      HC_FDIC_FAILURES: ${{ secrets.HC_FDIC_FAILURES }}
      HC_ATS_BOARDS: ${{ secrets.HC_ATS_BOARDS }}
      HC_WARN: ${{ secrets.HC_WARN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history so the state-commit rebase-retry can pull+replay
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Collect (${{ inputs.entry }} ${{ inputs.target }})
        run: |
          if [ "${{ inputs.entry }}" = "ats" ]; then
            python -m collectors.ats_boards
          elif [ "${{ inputs.entry }}" = "warn" ]; then
            python -m collectors.warn
          else
            python -m collectors.run "${{ inputs.target }}"
          fi
      - name: Persist collector state (W-002b)
        if: always()            # commit state even if the collector exited nonzero — the record
        run: |                  # carries the drift/pause flags the watcher needs.
          if [ "${{ inputs.entry }}" = "ats" ]; then name="ats-boards"; elif [ "${{ inputs.entry }}" = "warn" ]; then name="warn"; else name="${{ inputs.target }}"; fi
          f="ops/state/health/${name}.json"
          action=$(jq -r ".collectors[\"${name}\"].last_action // \"update\"" "$f" 2>/dev/null || echo update)
          # Dedupe firing: the committed baseline (last_hash) is unchanged, so a timestamp-only diff
          # is not worth a commit — skip it. Only real state changes (stored/quarantined/paused) get
          # persisted; this keeps over-scheduled collectors from spamming main and makes the monthly
          # keepalive genuinely load-bearing through all-stable stretches.
          if [ "${action}" = "unchanged" ]; then echo "unchanged — baseline already committed"; exit 0; fi
          if [ -z "$(git status --porcelain -- "$f")" ]; then
            echo "no state diff for ${name}"; exit 0
          fi
          git config user.name  "exhaust-bot"
          git config user.email "bot@theexhaust.org"
          h=$(jq -r ".collectors[\"${name}\"].last_hash // \"\"" "$f" 2>/dev/null | cut -c1-12)
          git add "$f"
          git commit -q -m "state(${name}): ${action} ${h} [skip ci]"
          # per-collector files never conflict; a rejected push means another collector pushed
          # concurrently -> rebase (clean replay, distinct file) and retry. Loud-fail after 2 retries.
          for attempt in 1 2 3; do
            if git push origin HEAD:main 2>/dev/null; then echo "state pushed (try ${attempt})"; exit 0; fi
            echo "push rejected; rebase+retry (${attempt})"
            git pull --rebase --autostash origin main || { echo "rebase failed"; exit 1; }
          done
          echo "state push failed after retries"; exit 1
