name: ci
# R1 deterministic runtime — standard runners only (larger runners bill even on public repos; banned).
# No metered LLM key exists here (SPEC-02 §1). The covenant guard enforces that on every run.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-and-hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Full suite (BUILD-PROTOCOL §5 — guards + all offline tests)
        run: python ci/run_all.py
      - name: Hello — foundations liveness
        run: echo "The Exhaust — R1 alive. Standard runner, no metered LLM key. $(date -u)"
