name: ci
# R1 deterministic runtime — standard runners only (larger runners bill even on public repos; banned).
# No metered LLM key exists here (SPEC-02 §1). The covenant guard enforces that on every run.
on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guard-and-hello:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install deps
        run: pip install -r requirements.txt
      - name: Covenant guard (do-not-collect + no R1 LLM key)
        run: python ci/covenant_guard.py
      - name: Covenant guard tests
        run: python ci/test_covenant_guard.py
      - name: Framework tests (offline)
        run: python -m collectors.tests.test_framework
      - name: Ops-core tests (offline)
        run: python -m opscore.tests.test_opscore
      - name: Retrocast harness tests (offline)
        run: python -m retrocast.tests.test_harness
      - name: Site generator tests (offline)
        run: python -m sitegen.tests.test_site
      - name: Engine tests (offline)
        run: python -m engines.tests.test_engines
      - name: Hello — foundations liveness
        run: echo "The Exhaust — R1 alive. Standard runner, no metered LLM key. $(date -u)"
